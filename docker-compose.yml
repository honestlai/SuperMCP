services:
  supermcp:
    image: ghcr.io/honestlai/supermcp:latest
    container_name: SuperMCP
    ports:
      - "8080:8080"    # MCP Gateway (single entry point)
    volumes:
      - workspace:/workspace:rw
      - data:/data:rw
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      # ─── API key authentication (optional) ───
      # Set a key here to require Bearer token auth on all MCP endpoints.
      # Clients must send: Authorization: Bearer <your-key>
      # If not set, the gateway runs open with no auth.
      # - GATEWAY_API_KEY=your_secret_key_here
      #
      # ─── LLM provider (shared by YouTube Transcriber + Video2Doc) ───
      # Set once here; all AI-powered MCPs use this provider by default.
      # See README for per-service overrides (different providers per task).
      # - LLM_API_KEY=your_api_key_here
      # - LLM_BASE_URL=https://api.fireworks.ai/inference/v1
      #
      # ─── Core servers ───
      - ENABLE_PLAYWRIGHT=true
      - ENABLE_FILESYSTEM=true
      - ENABLE_SEQUENTIAL_THINKING=true
      - ENABLE_MEMORY=true
      - ENABLE_PYTHON_INTERPRETER=true
      # ─── GitHub ───
      # - ENABLE_GITHUB=true
      # - GITHUB_PERSONAL_ACCESS_TOKEN=ghp_your_token_here
      # ─── Web search (uses bundled SearXNG + Valkey below) ───
      - ENABLE_SEARXNG=true
      - SEARXNG_SERVER_URL=http://searxng:8080
      # ─── Documentation lookup ───
      # - ENABLE_CONTEXT7=true
      # - CONTEXT7_API_KEY=your_key_here
      # ─── YouTube Transcriber ───
      # Transcribes YouTube videos via a Whisper-compatible API.
      # Uses LLM_API_KEY / LLM_BASE_URL above by default.
      # - ENABLE_YOUTUBE_TRANSCRIBER=true
      # - TRANSCRIBER_MODEL=whisper-large-v3-turbo
      # ─── Web fetching and local git ───
      # - ENABLE_FETCH=true
      # - ENABLE_GIT=true
      # ─── Video2Doc ───
      # Converts video recordings (Zoom, Loom, Drive, mp4, local files) into
      # structured markdown docs with screenshots. Uses LLM_API_KEY / LLM_BASE_URL.
      # See README for full model recommendations per provider.
      # - ENABLE_VIDEO2DOC=true
      # - VISION_MODEL=accounts/fireworks/models/qwen2-vl-72b-instruct
      # - SUMMARY_MODEL=accounts/fireworks/models/llama4-scout-instruct-basic
      # - TRANSCRIBER_MODEL=whisper-v3
    restart: unless-stopped
    networks:
      - Network-Bridge
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Valkey cache (used by SearXNG for result caching & rate limiting) ───
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    networks:
      - Network-Bridge
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # ─── SearXNG search engine (used by the SearXNG MCP server) ───
  # If you already run your own SearXNG instance, remove this service
  # and point SEARXNG_SERVER_URL to your existing instance instead.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"    # SearXNG web UI (optional, for testing)
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_REDIS_URL=redis://valkey:6379/0
    restart: unless-stopped
    networks:
      - Network-Bridge
    depends_on:
      - valkey
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  Network-Bridge:
    external: true

volumes:
  workspace:
  data:
  searxng-data:
  valkey-data:
