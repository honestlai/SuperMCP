services:
  supermcp:
    image: ghcr.io/honestlai/supermcp:latest
    container_name: SuperMCP
    ports:
      - "8080:8080"    # MCP Gateway (single entry point)
    volumes:
      - workspace:/workspace:rw
      - data:/data:rw
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      # ─── API key authentication (optional) ───
      # Set a key here to require Bearer token auth on all MCP endpoints.
      # Clients must send: Authorization: Bearer <your-key>
      # If not set, the gateway runs open with no auth.
      # - GATEWAY_API_KEY=your_secret_key_here
      #
      # ─── Core servers ───
      - ENABLE_PLAYWRIGHT=true
      - ENABLE_FILESYSTEM=true
      - ENABLE_SEQUENTIAL_THINKING=true
      - ENABLE_MEMORY=true
      - ENABLE_PYTHON_INTERPRETER=true
      # ─── GitHub ───
      # - ENABLE_GITHUB=true
      # - GITHUB_PERSONAL_ACCESS_TOKEN=ghp_your_token_here
      # ─── Web search (uses bundled SearXNG + Valkey below) ───
      - ENABLE_SEARXNG=true
      - SEARXNG_SERVER_URL=http://searxng:8080
      # ─── Documentation lookup ───
      # - ENABLE_CONTEXT7=true
      # - CONTEXT7_API_KEY=your_key_here
      # ─── YouTube transcription ───
      # Supports any Whisper-compatible API. Set TRANSCRIBER_PROVIDER for
      # easy setup or use TRANSCRIBER_BASE_URL + TRANSCRIBER_MODEL for full control.
      # Providers: openai, fireworks, groq  (or any OpenAI-compatible endpoint)
      # - ENABLE_YOUTUBE_TRANSCRIBER=true
      # - TRANSCRIBER_PROVIDER=groq
      # - TRANSCRIBER_API_KEY=your_api_key_here
      # - TRANSCRIBER_BASE_URL=              # (optional) override the provider's API URL
      # - TRANSCRIBER_MODEL=                 # (optional) override the default model
      # Legacy (still works): FIREWORKS_API_KEY=your_key  (auto-selects fireworks provider)
      # ─── Web fetching and local git ───
      # - ENABLE_FETCH=true
      # - ENABLE_GIT=true
      # ─── Video Doc MCP ───
      # Processes video recordings (Zoom, Loom, Drive, direct mp4, local files)
      # into summary docs with embedded screenshots. Requires a vision model.
      # All model endpoints use the OpenAI-compatible API — swap providers freely.
      # See README for full model recommendations per provider.
      # - ENABLE_VIDEO_DOC=true
      #
      # -- Vision model (MUST support image/multimodal input) --
      # Ollama (local):   VISION_BASE_URL=http://ollama:11434/v1  VISION_MODEL=qwen2-vl:7b
      # Fireworks AI:     VISION_BASE_URL=https://api.fireworks.ai/inference/v1  VISION_MODEL=accounts/fireworks/models/qwen2-vl-72b-instruct
      # OpenAI:           VISION_BASE_URL=https://api.openai.com/v1  VISION_MODEL=gpt-4o
      # Together AI:      VISION_BASE_URL=https://api.together.xyz/v1  VISION_MODEL=Qwen/Qwen2-VL-72B-Instruct
      # - VISION_API_KEY=your_key_here
      # - VISION_BASE_URL=https://api.fireworks.ai/inference/v1
      # - VISION_MODEL=accounts/fireworks/models/qwen2-vl-72b-instruct
      #
      # -- Summary model (text-only, optional — defaults to VISION_* if not set) --
      # Set these to use a cheaper text model for transcript summarization.
      # Fireworks AI cheap: SUMMARY_MODEL=accounts/fireworks/models/llama4-scout-instruct-basic
      # OpenAI cheap:       SUMMARY_MODEL=gpt-4o-mini
      # - SUMMARY_API_KEY=your_key_here
      # - SUMMARY_BASE_URL=https://api.fireworks.ai/inference/v1
      # - SUMMARY_MODEL=accounts/fireworks/models/llama4-scout-instruct-basic
      #
      # -- Transcription (shared with YouTubeTranscriber, Whisper-compatible) --
      # TRANSCRIBER_API_KEY / TRANSCRIBER_BASE_URL / TRANSCRIBER_MODEL
    restart: unless-stopped
    networks:
      - Network-Bridge
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Valkey cache (used by SearXNG for result caching & rate limiting) ───
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    networks:
      - Network-Bridge
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # ─── SearXNG search engine (used by the SearXNG MCP server) ───
  # If you already run your own SearXNG instance, remove this service
  # and point SEARXNG_SERVER_URL to your existing instance instead.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"    # SearXNG web UI (optional, for testing)
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_REDIS_URL=redis://valkey:6379/0
    restart: unless-stopped
    networks:
      - Network-Bridge
    depends_on:
      - valkey
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  Network-Bridge:
    external: true

volumes:
  workspace:
  data:
  searxng-data:
  valkey-data:
